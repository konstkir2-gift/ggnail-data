<script>/* G&G: ускорение страниц.
   1) Карты. В подвале стоит пять копий одной Яндекс Карты, по одной на каждую ширину экрана, и грузятся все.
      Оставляем только ту, что видна на экране, и загружаем её, когда до неё долистали.

      Переводим их на её же ленивую загрузку: картинка грузится, когда до неё долистали, и в формате WebP. */

    later(300);
  }
  function lazyBg(el) {
    if (el.ggBg || el.getAttribute('data-original')) return;
    if (lazyOn === null) { var all = document.getElementById('allrecords'); lazyOn = !!all && all.getAttribute('data-tilda-lazy') === 'yes'; }
    if (!lazyOn) return;

    el.style.backgroundImage = "url('https://thb.tildacdn.com/" + m[2] + '/-/resize/20x/' + m[3] + "')";
  }
  function scan(n) {

      [].forEach.call(box.querySelectorAll('button[data-org]'), function (x) { x.className = x === b ? 'gg-on' : ''; });
      if ((f = box.querySelector('.gg-rev-badge'))) f.src = W;
      if ((f = box.querySelector('.gg-rev-box iframe'))) f.src = W + '?comments';
      if ((f = box.querySelector('.gg-rev-more a'))) f.href = 'https://yandex.ru/maps/org/g_g/' + org + '/reviews/';
      return;
    }
    if (b.className.indexOf('gg-rev-show') > -1) revShow(box);
  });
  /* блок акции в подвале (web/make_promo.py, класс gg-promo). Пока его нет на странице, прячем пункт меню «Акции».
     В новых браузерах это делает правило :has в gg.css, здесь запасной путь для старых. */
  function promoLinks() {
    if (document.querySelector('.gg-promo')) return;
    [].forEach.call(document.querySelectorAll('a[href$="#hot"]'), function (a) { var li = a.closest ? a.closest('li') : null; (li || a).style.display = 'none'; });
  }
  /* страницы абонементов и сертификатов (web/make_offers.py). Цены вшиты в страницу при сборке. Если служба sync кладёт
     в site.json поля abon и cert, подставляем свежие; услуга, у которой абонемент убрали, со страницы исчезает. */
  /* условия одного номинала сертификата: те же слова, что в web/make_offers.py (cert_line) */
  function certLine(x) {
    var m = x.m, term;
    if (m > 0) term = 'действует ' + (m === 12 ? 'один год' : m + ' ' + (m === 1 ? 'месяц' : m < 5 ? 'месяца' : 'месяцев'));
    else term = m === 0 ? 'без срока' : 'срок назовёт администратор';
    var p = [x.goods ? 'услуги и товары' : 'услуги', x.multi ? 'можно тратить частями' : 'на один визит', term];
    if (!x.on) p.push('продаётся только в салоне');
    return p.join(', ');
  }
  /* новая цена абонемента принимается, если она не дальше чем в 2,5 раза от вшитой в страницу */
  function near(el, v) { var o = int(String(el.textContent).replace(/\D/g, '')); return !o || (v >= o * 0.4 && v <= o * 2.5); }
  function offersApply(d) {
    if (!d) return;
    if (d.abon) [].forEach.call(document.querySelectorAll('.gg-ab[data-ab-s]'), function (c) {
      var e = d.abon[c.getAttribute('data-ab-s')], one = c.querySelector('[data-ab="one"]');
      if (!e || !e.k) { c.style.display = 'none'; return; }
      if (one && e.one && near(one, e.one)) one.textContent = num(e.one) + NBSP + '₽';
      [].forEach.call(c.querySelectorAll('li[data-ab-n]'), function (li) {
        var n = li.getAttribute('data-ab-n'), v = e.k[n], b, sm;
        if (!v) { li.style.display = 'none'; return; }
        b = li.querySelector('[data-ab="' + n + '"]');
        if (!b || !near(b, v[0])) return;
        b.textContent = num(v[0]) + NBSP + '₽';
        if ((sm = li.querySelector('[data-ab="per' + n + '"]'))) sm.textContent = 'по ' + num(Math.round(v[0] / n)) + NBSP + '₽ за сеанс';
      });
    });
    if (d.certinfo && d.certinfo.length) [].forEach.call(document.querySelectorAll('.gg-certlist[data-certs]'), function (c) {
      c.innerHTML = d.certinfo.map(function (x) { return '<li><b>' + num(x.b) + NBSP + '₽</b><span>' + certLine(x) + '</span></li>'; }).join('');
    });
  }
  function offersLoad() {
    if (!document.querySelector('.gg-price[data-offer]')) return;
    function done(d) { d = clean(d, ''); if (!d) return; offersApply(d); revAuto(d.rev !== false); }
    try {
      var c = window.sessionStorage.getItem('gg_data');
      if (c) { c = JSON.parse(c); if (Date.now() - c.at < 600000) { done(c.d); return; } }
    } catch (e) {}
    if (!window.fetch) return;
    fetch(DATA_URL).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {
      if (!d || d.v !== 2 || !d.branches) return;
      try { window.sessionStorage.setItem('gg_data', JSON.stringify({at: Date.now(), d: d})); } catch (e) {}
      done(d);
    }).catch(function () {});
  }
  visitSrc();
  window.addEventListener('load', function () {
    patchWidget(); setTimeout(patchWidget, 3000);
    var n = 0, t = setInterval(function () { if (fixYm() || ++n > 60) clearInterval(t); }, 500);
  });

  /* у блока акции и у вопроса про скидки стоит data-until (последний день показа, по Москве): после него убираем их со страницы */
  function expire() {
    var today = new Date(Date.now() + 3 * 3600 * 1000).toISOString().slice(0, 10);
    [].forEach.call(document.querySelectorAll('[data-until]'), function (el) {
      if (today > el.getAttribute('data-until') && el.parentNode) el.parentNode.removeChild(el);
    });
  }
  function boot() {
    expire(); promoLinks(); offersLoad();
    var n = document.querySelectorAll('.gg-price[data-section]');
    if (n.length && document.documentElement.className.indexOf('gg-has-price') < 0) document.documentElement.className += ' gg-has-price';
    for (var i = 0; i < n.length; i++) { if (!n[i].ggApp) n[i].ggApp = new App(n[i]); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
