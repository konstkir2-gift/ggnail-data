<!-- G&G: карты в подвале, картинки, прайс из YCLIENTS -->
<script>/* G&G: ускорение страниц.
   1) Карты. В подвале стоит пять копий одной Яндекс Карты, по одной на каждую ширину экрана, и грузятся все.
      Оставляем только ту, что видна на экране, и загружаем её, когда до неё долистали.
   2) Картинки. Часть фонов в Zero-блоках Тильда отдаёт сразу и в исходном размере (по мегабайту на фото).
      Переводим их на её же ленивую загрузку: картинка грузится, когда до неё долистали, и в формате WebP. */
(function () {
  if (!window.MutationObserver) return;
  var MAP = /yandex\.[a-z]+\/map-widget\//, frames = [], timer = null;
  var BG = /url\(\s*['"]?(https:\/\/static\.tildacdn\.com\/(tild[0-9a-f-]+)\/([^'")]+\.(?:png|jpe?g)))['"]?\s*\)/i, bgs = [], lazyOn = null;
  function check() {
    var w = window.innerWidth || document.documentElement.clientWidth, h = window.innerHeight || 800;
    for (var i = 0; i < frames.length; i++) {
      var f = frames[i]; if (f.ggOn) continue;
      var r = f.getBoundingClientRect();
      if (r.width > 0 && r.right > 0 && r.left < w && r.top < h + 700 && r.bottom > -700) { f.ggOn = 1; f.src = f.ggSrc; }
    }
  }
  function later(ms) { clearTimeout(timer); timer = setTimeout(check, ms); }
  function grab(f) {
    if (f.ggOn || !f.src || !MAP.test(f.src)) return;
    if (!f.ggSrc) frames.push(f);
    f.ggSrc = f.src; f.src = 'about:blank';
    later(300);
  }
  function lazyBg(el) {
    if (el.ggBg || el.getAttribute('data-original')) return;
    if (lazyOn === null) { var all = document.getElementById('allrecords'); lazyOn = !!all && all.getAttribute('data-tilda-lazy') === 'yes'; }
    if (!lazyOn) return;
    var m = BG.exec(el.getAttribute('style') || ''); if (!m) return;
    el.ggBg = m[1]; bgs.push(el);
    el.setAttribute('data-original', m[1]);
    el.setAttribute('data-lazy-rule', 'skip'); /* у этих фонов свой кадр и масштаб, поэтому размер не трогаем, меняется только формат */
    el.style.backgroundImage = "url('https://thb.tildacdn.com/" + m[2] + '/-/resize/20x/' + m[3] + "')";
  }
  function scan(n) {
    if (n.tagName === 'IFRAME') { grab(n); return; }
    if (n.className && typeof n.className === 'string' && n.className.indexOf('t-bgimg') > -1) lazyBg(n);
    if (!n.querySelectorAll) return;
    var fs = n.querySelectorAll('iframe'), k; for (k = 0; k < fs.length; k++) grab(fs[k]);
    var bs = n.querySelectorAll('.t-bgimg'); for (k = 0; k < bs.length; k++) lazyBg(bs[k]);
  }
  new MutationObserver(function (ms) {
    for (var i = 0; i < ms.length; i++) {
      var m = ms[i];
      if (m.type === 'attributes') { if (m.target.tagName === 'IFRAME') grab(m.target); continue; }
      for (var j = 0; j < m.addedNodes.length; j++) { if (m.addedNodes[j].nodeType === 1) scan(m.addedNodes[j]); }
    }
  }).observe(document.documentElement, {childList: true, subtree: true, attributes: true, attributeFilter: ['src']});
  window.addEventListener('scroll', function () { if (frames.length) later(150); }, {passive: true});
  window.addEventListener('resize', function () { if (frames.length) later(400); });
  /* страховка: если ленивая загрузка Тильды не запустилась, возвращаем картинки как были */
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (typeof window.t_lazyload_update === 'function') return;
      for (var i = 0; i < bgs.length; i++) { bgs[i].removeAttribute('data-original'); bgs[i].removeAttribute('data-lazy-rule'); bgs[i].style.backgroundImage = "url('" + bgs[i].ggBg + "')"; }
    }, 4000);
  });
})();
</script>

<script>/* Прайс G&G: цены приходят из YCLIENTS. Блок рисуется из данных, вшитых в страницу, и молча обновляется свежими. */
(function () {
  var CFG = window.GG_CFG || {};
  var DATA_URL = CFG.dataUrl || 'https://konstkir2-gift.github.io/ggnail-data/site.json';
  var DATA_URL2 = CFG.dataUrl2 === undefined ? 'https://cdn.jsdelivr.net/gh/konstkir2-gift/ggnail-data@main/site.json' : CFG.dataUrl2;
  var COUNTER = CFG.counter || 87156332;
  var LABELS = {
    nails: {base: 'Мастер', expert: 'Эксперт', top: 'Топ-мастер', instructor: 'Инструктор'},
    hair: {base: 'Стилист', top: 'Топ-стилист'},
    def: {base: 'Мастер', expert: 'Эксперт', top: 'Топ-мастер', instructor: 'Инструктор'}
  };
  /* короткие подписи: когда переключатель прилип к верху экрана, справа его перекрывает кнопка меню сайта */
  var SHORT = {top: 'Топ'};
  var NBSP = ' ';

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function num(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP); }
  function price(p) {
    if (!p) return 'нет';
    if (!p[1] && !p[2]) return 'бесплатно';
    if (p[1] === p[2]) return num(p[1]) + NBSP + '₽';
    if (!p[1]) return 'до ' + num(p[2]) + NBSP + '₽';
    return num(p[1]) + '–' + num(p[2]) + NBSP + '₽';
  }
  function dur1(s) { var m = Math.round(s / 60), h = Math.floor(m / 60); m = m % 60; return (h ? h + NBSP + 'ч' : '') + (h && m ? ' ' : '') + (m ? m + NBSP + 'мин' : ''); }
  function dur(p) {
    if (!p || !p[3]) return '';
    if (p[3] === p[4]) return dur1(p[3]);
    if (p[4] < 3600) return Math.round(p[3] / 60) + '–' + Math.round(p[4] / 60) + NBSP + 'мин';
    return dur1(p[3]) + ' – ' + dur1(p[4]);
  }
  /* Метрику на сайте запускает виджет YCLIENTS, счётчик лежит в его объекте; обычный ym() оставлен на случай, если счётчик поставят и в Тильде */
  function goal(name, params) {
    try {
      var w = window.yWidget, c = window.__widgetYaCounter || (w && w.counters && w.counters.yaCounter);
      if (c && typeof c.reachGoal === 'function') c.reachGoal(name, params);
      else if (typeof window.ym === 'function') window.ym(COUNTER, 'reachGoal', name, params);
    } catch (x) {}
  }
  function store(k, v) { try { if (v === undefined) return window.localStorage.getItem(k); window.localStorage.setItem(k, v); } catch (e) { return null; } }

  function App(root) {
    this.root = root;
    this.sec = root.getAttribute('data-section');
    this.box = root.querySelector('.gg-app');
    this.data = JSON.parse(root.querySelector('script.gg-data').textContent);
    this.open = {};
    var saved = store('gg_branch');
    this.branch = this.pickBranch(saved ? +saved : null);
    this.cat = null;
    var self = this;
    root.addEventListener('click', function (e) { self.click(e); });
    this.stuck = false;
    var wait = false;
    window.addEventListener('scroll', function () {
      if (wait) return; wait = true;
      (window.requestAnimationFrame || setTimeout)(function () { wait = false; self.stick(); });
    }, {passive: true});
    this.render();
    this.refresh();
  }
  App.prototype.branches = function () { var s = this.sec; return this.data.branches.filter(function (b) { return b.sec && b.sec[s]; }); };
  App.prototype.pickBranch = function (id) { var bs = this.branches(); for (var i = 0; i < bs.length; i++) if (bs[i].id === id) return id; return bs.length ? bs[0].id : null; };
  App.prototype.cur = function () { var bs = this.branches(); for (var i = 0; i < bs.length; i++) if (bs[i].id === this.branch) return bs[i]; return bs[0]; };
  App.prototype.bookUrl = function (id) { return this.data.form + '/company/' + this.branch + '/personal/menu' + (id ? '?o=s' + id : ''); };
  App.prototype.render = function () {
    var b = this.cur(); if (!b) { return; }
    var sec = b.sec[this.sec], cats = sec.cats, lab = LABELS[this.sec] || LABELS.def, self = this, h = '';
    if (cats.indexOf(this.cat) < 0) this.cat = cats[0];
    var bs = this.branches();
    if (bs.length > 1) {
      h += '<div class="gg-seg gg-branch">';
      bs.forEach(function (x) { h += '<button type="button" data-b="' + x.id + '"' + (x.id === b.id ? ' class="gg-on"' : '') + '>' + esc(x.name) + '</button>'; });
      h += '</div>';
    } else { h += '<p class="gg-only">Эти услуги есть в салоне на ' + esc(b.name.replace(/^Пражская/, 'Пражской').replace(/^Европейский/, 'Европейском')) + '</p>'; }
    if (cats.length > 1) {
      h += '<div class="gg-bar' + (this.stuck ? ' gg-stuck' : '') + '"><div class="gg-seg">';
      cats.forEach(function (c) {
        var l = lab[c] || LABELS.def[c], sh = cats.length > 3 && SHORT[c];
        h += '<button type="button" data-c="' + c + '"' + (c === self.cat ? ' class="gg-on"' : '') + '>' + (sh ? '<span class="gg-l">' + l + '</span><span class="gg-s">' + sh + '</span>' : l) + '</button>';
      });
      h += '</div></div>';
    }
    if (sec.subs.length > 1) {
      h += '<nav class="gg-hs gg-sub">';
      sec.subs.forEach(function (s, i) { h += '<button type="button" data-s="gg-' + self.sec + '-' + i + '">' + esc(s.t) + '</button>'; });
      h += '</nav>';
    }
    sec.subs.forEach(function (s, i) {
      h += '<section id="gg-' + self.sec + '-' + i + '">' + (sec.subs.length > 1 ? '<h2>' + esc(s.t) + '</h2>' : '') + '<ul>';
      s.rows.forEach(function (r, j) { h += self.row(r, i + '-' + j); });
      h += '</ul></section>';
    });
    h += '<p class="gg-upd">' + this.stamp() + '</p>';
    h += '<div class="gg-cta"><a class="gg-book" data-any="1" href="' + this.bookUrl() + '">Записаться онлайн</a></div>';
    this.box.innerHTML = h;
  };
  App.prototype.stick = function () {
    var b = this.box.querySelector('.gg-bar'); if (!b) return;
    var st = b.getBoundingClientRect().top <= 1;
    if (st !== this.stuck) { this.stuck = st; b.className = 'gg-bar' + (st ? ' gg-stuck' : ''); }
  };
  App.prototype.stamp = function () {
    var d = this.data.checked || this.data.built || '';
    return d ? 'Цены из системы записи, сверены ' + esc(d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4)) : '';
  };
  App.prototype.row = function (r, key) {
    var c = this.cat, open = !!this.open[key], h, self = this;
    if (r.vars) {
      var have = r.vars.filter(function (v) { return v.p[c]; });
      var mn = null; have.forEach(function (v) { if (mn === null || v.p[c][1] < mn) mn = v.p[c][1]; });
      h = '<li class="gg-row' + (have.length ? '' : ' gg-no') + '"><button type="button" class="gg-line" data-k="' + key + '" aria-expanded="' + open + '"><span class="gg-n">' + esc(r.t) +
        '<small>' + r.vars.length + ' ' + (r.vars.length < 5 ? 'варианта' : 'вариантов') + ' по длине волос</small></span><span class="gg-p">' + (have.length ? 'от ' + num(mn) + NBSP + '₽' : 'нет') + '</span><span class="gg-pl"></span></button>';
      h += '<div class="gg-more"' + (open ? '' : ' hidden') + '>' + (r.n ? '<p>' + esc(r.n) + '</p>' : '');
      r.vars.forEach(function (v) {
        var p = v.p[c];
        h += '<div class="gg-var"><span>' + esc(v.l.charAt(0).toUpperCase() + v.l.slice(1)) + (p && dur(p) ? '<small>' + dur(p) + '</small>' : '') + '</span><b>' + price(p) + '</b>' +
          (p ? '<a class="gg-book" data-t="' + esc(r.t + ', ' + v.l) + '" href="' + self.bookUrl(p[0]) + '">Записаться</a>' : '') + '</div>';
      });
      return h + '</div></li>';
    }
    var p = r.p[c], d = /\d\s*мин/i.test(r.t) ? '' : dur(p);
    h = '<li class="gg-row' + (p ? '' : ' gg-no') + '"><button type="button" class="gg-line" data-k="' + key + '" aria-expanded="' + open + '"><span class="gg-n">' + esc(r.t) + (d ? '<small>' + d + '</small>' : '') +
      '</span><span class="gg-p">' + price(p) + '</span><span class="gg-pl"></span></button><div class="gg-more"' + (open ? '' : ' hidden') + '>' + (r.n ? '<p>' + esc(r.n) + '</p>' : '') +
      (p ? '<a class="gg-book" data-t="' + esc(r.t) + '" href="' + this.bookUrl(p[0]) + '">Записаться на эту услугу</a>' : '<p>У мастеров этой категории такой услуги нет. Выберите другую категорию.</p>') + '</div></li>';
    return h;
  };
  App.prototype.click = function (e) {
    var t = e.target, el;
    if ((el = t.closest('[data-b]'))) { this.branch = +el.getAttribute('data-b'); store('gg_branch', String(this.branch)); this.open = {}; this.render(); return; }
    if ((el = t.closest('[data-c]'))) { this.cat = el.getAttribute('data-c'); this.render(); return; }
    if ((el = t.closest('[data-s]'))) {
      var sc = document.getElementById(el.getAttribute('data-s'));
      if (sc) { try { sc.scrollIntoView({behavior: 'smooth', block: 'start'}); } catch (x) { sc.scrollIntoView(); } }
      return;
    }
    if ((el = t.closest('.gg-line'))) {
      var k = el.getAttribute('data-k'), o = !this.open[k]; this.open[k] = o;
      el.setAttribute('aria-expanded', o); el.nextElementSibling.hidden = !o; return;
    }
    if ((el = t.closest('a.gg-book'))) {
      goal('gg_book', {section: this.sec, service: el.getAttribute('data-t') || 'общая кнопка', category: this.cat, salon: this.cur().name});
      var w = window.yWidget;
      if (w && typeof w.show === 'function') {
        e.preventDefault();
        var url = el.href;
        try { var q = w.buildSearchQuery(); if (q) url += (url.indexOf('?') > -1 ? '&' : '?') + q; } catch (x) {}
        w.show(url);
      }
    }
  };
  App.prototype.refresh = function () {
    var self = this;
    function use(d) {
      if (!d || d.v !== 2 || !d.branches) return;
      if (d.built && self.data.built && d.built < self.data.built) return;
      if (d.hash === self.data.hash) {
        /* цены те же, обновилась только дата сверки */
        if (d.checked && d.checked > (self.data.checked || '')) { self.data.checked = d.checked; var u = self.box.querySelector('.gg-upd'); if (u) u.innerHTML = self.stamp(); }
        return;
      }
      self.data = d; self.branch = self.pickBranch(self.branch); self.render();
    }
    try {
      var c = window.sessionStorage.getItem('gg_data');
      if (c) { c = JSON.parse(c); if (Date.now() - c.at < 600000) { use(c.d); return; } }
    } catch (e) {}
    if (!window.fetch) return;
    /* запасной адрес отдаёт ту же копию через другую сеть; метка дня не даёт браузеру держать её неделю */
    var urls = [DATA_URL];
    if (DATA_URL2) urls.push(DATA_URL2 + (DATA_URL2.indexOf('?') < 0 ? '?d=' : '&d=') + new Date().toISOString().slice(0, 10));
    (function next(i) {
      if (i >= urls.length) return;
      var ctl = window.AbortController ? new AbortController() : null;
      var t = setTimeout(function () { if (ctl) ctl.abort(); }, 5000);
